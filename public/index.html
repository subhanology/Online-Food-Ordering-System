<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Food Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header py-4 mb-4"><div class="container"><h1>Food Ordering System</h1><p class="mb-0">Choose your meal and place an order.</p></div></header>
  <main class="container pb-5">
    <div id="message" role="status" aria-live="polite"></div>
    <div class="row g-4">
      <section class="col-lg-8">
        <h2 class="h4 mb-3">Food menu</h2>
        <div id="foodList" class="row row-cols-1 row-cols-sm-2 row-cols-xl-3 g-3"></div>
      </section>
      <aside class="col-lg-4">
        <section class="card p-3 mb-3"><h2 class="h4">Your cart</h2><div id="cartList"></div><hr><p class="fw-bold mb-0">Total: Rs. <span id="total">0</span></p></section>
        <section class="card p-3"><h2 class="h4">Customer details</h2>
          <form id="orderForm" novalidate>
            <div class="mb-3"><label for="name" class="form-label">Name</label><input class="form-control" id="name" required></div>
            <div class="mb-3"><label for="phone" class="form-label">Phone (11 digits)</label><input class="form-control" id="phone" type="tel" pattern="[0-9]{11}" required></div>
            <div class="mb-3"><label for="address" class="form-label">Delivery address</label><textarea class="form-control" id="address" required></textarea></div>
            <button id="submitOrder" class="btn btn-success w-100" type="submit">Place order</button>
          </form>
        </section>
      </aside>
    </div>
    <section class="mt-5"><h2 class="h4">Order history</h2><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Customer</th><th>Items</th><th>Total (Rs.)</th></tr></thead><tbody id="orderList"></tbody></table></div></section>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
